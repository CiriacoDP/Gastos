<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Meu dinheiro</title>
<style>
:root{color-scheme:light dark;--bg:#f2f2f7;--card:#fff;--ink:#000;--mut:#8a8a8e;--sep:#e5e5ea;--fill:#e9e9ee;--segon:#fff;--blue:#007aff;--green:#34c759;--red:#ff3b30;--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.05)}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#fff;--mut:#98989f;--sep:#38383a;--fill:#2c2c2e;--segon:#636366;--blue:#0a84ff;--green:#30d158;--red:#ff453a;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(120px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.shell{width:min(640px,100% - 32px);margin:auto}
header{padding-top:calc(14px + env(safe-area-inset-top))}
.bar{display:flex;justify-content:space-between;align-items:center;min-height:36px}
.status{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mut)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--green)}
.status.off i{background:var(--red)}
.icon{width:36px;height:36px;border-radius:50%;background:var(--fill);font-size:18px;color:var(--blue)}
h1{font-size:34px;line-height:1.1;letter-spacing:-.6px;margin:8px 0 18px}
.months{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.months b{font-weight:600}
.months button{width:36px;height:36px;border-radius:50%;background:var(--fill);color:var(--blue);font-size:22px;line-height:1}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
.summary{padding:20px}
.summary small{display:block;color:var(--mut);font-size:13px}
#balance{display:block;font-size:42px;font-weight:700;letter-spacing:-1.2px;margin:2px 0 16px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:14px;border-top:.5px solid var(--sep)}
.trio strong{display:block;font-size:16px;font-weight:600;margin-top:2px}
.pos{color:var(--green)}.neg{color:var(--red)}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;padding:7px 4px;border-radius:7px;font-size:13px;font-weight:500;white-space:nowrap}
.seg button.on{background:var(--segon);box-shadow:0 1px 3px rgba(0,0,0,.16);font-weight:600}
.filters{margin:18px 0 12px}
.list{list-style:none;margin:0;padding:0;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;position:relative;cursor:pointer}
.row+.row::before{content:"";position:absolute;top:0;left:54px;right:0;border-top:.5px solid var(--sep)}
.check{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid #c7c7cc;position:relative}
.check::before{content:"";position:absolute;inset:-10px}
.check.on{background:var(--green);border-color:var(--green)}
.check.on::after{content:"";position:absolute;left:8px;top:4px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.main{flex:1;min-width:0}
.t{font-weight:500;overflow-wrap:anywhere}
.s{font-size:13px;color:var(--mut);margin-top:1px}
.row.done .t{color:var(--mut)}
.amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{padding:38px 20px;text-align:center;color:var(--mut);font-size:15px}
.empty small{display:block;margin-top:8px;font-size:12px}
.conn{margin-top:22px;padding:4px 16px}
.conn summary{padding:12px 0;color:var(--mut);font-size:15px;cursor:pointer}
.conn input{width:100%;padding:11px 12px;border-radius:10px;border:0;outline:none;background:var(--fill);font-size:15px;margin:4px 0 12px}
.primary{width:100%;padding:13px;border-radius:12px;background:var(--blue);color:#fff;font-weight:600}
.msg{font-size:13px;min-height:16px;margin:8px 0 12px;color:var(--green)}
.msg.error{color:var(--red)}
.fab{position:fixed;right:max(20px,calc((100vw - 640px)/2 + 4px));bottom:calc(24px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;background:var(--blue);color:#fff;font-size:34px;font-weight:300;line-height:1;box-shadow:0 8px 24px rgba(0,122,255,.4)}
.overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,0);transition:background .25s}
.overlay.open{background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheet{width:min(520px,100%);max-height:94dvh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.open .sheet{transform:none}
@media(min-width:640px){.overlay{align-items:center}.sheet{border-radius:22px}}
.sheet-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:16px}
.sheet-head h2{margin:0;font-size:17px;font-weight:600}
.link{color:var(--blue);font-size:17px;justify-self:start}
.link.strong{font-weight:600;justify-self:end}
.link:disabled{opacity:.4}
.amount-wrap{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:22px 0}
.amount-wrap span{font-size:28px;color:var(--mut);font-weight:600}
.amount-wrap input{width:210px;border:0;background:none;outline:none;font-size:44px;font-weight:700;letter-spacing:-1px;text-align:center;padding:0}
.group{background:var(--card);border-radius:14px;overflow:hidden;margin-top:6px}
.cell{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;min-height:48px;position:relative}
.cell+.cell::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.cell>span{flex:none}
.cell input{flex:1;min-width:0;border:0;background:none;outline:none;text-align:right;font-size:17px}
.cell .seg{width:190px}
.danger{width:100%;margin-top:18px;padding:13px;border-radius:14px;background:var(--card);color:var(--red);font-weight:500}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-160%);z-index:20;max-width:calc(100% - 32px);padding:11px 16px;border-radius:14px;background:rgba(44,44,46,.94);color:#fff;font-size:14px;transition:transform .3s;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.toast.show{transform:translate(-50%,0)}
.toast.err{background:rgba(255,59,48,.96)}
</style>
</head>
<body>
<header class="shell">
  <div class="bar">
    <div class="status off" id="status"><i></i><span id="statusText">Desconectado</span></div>
    <button class="icon" id="refreshBtn" aria-label="Atualizar">↻</button>
  </div>
  <h1>Meu dinheiro</h1>
</header>
<main class="shell">
  <div class="months">
    <button id="prev" aria-label="Mês anterior">‹</button>
    <b id="monthLabel"></b>
    <button id="next" aria-label="Próximo mês">›</button>
  </div>
  <section class="card summary">
    <small>Saldo previsto</small>
    <strong id="balance">R$ 0,00</strong>
    <div class="trio">
      <div><small>Entradas</small><strong class="pos" id="incomeTotal">R$ 0,00</strong></div>
      <div><small>Despesas</small><strong id="expenseTotal">R$ 0,00</strong></div>
      <div><small>A pagar</small><strong id="dueTotal">R$ 0,00</strong></div>
    </div>
  </section>
  <div class="seg filters" id="filters">
    <button class="on" data-filter="all">Todas</button>
    <button data-filter="pending">Pendentes</button>
    <button data-filter="paid">Pagas</button>
    <button data-filter="income">Entradas</button>
  </div>
  <ul class="card list" id="list"></ul>
  <details class="card conn">
    <summary>Conexão com a planilha</summary>
    <input id="apiUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec" aria-label="URL do Google Apps Script">
    <button class="primary" id="connectBtn" type="button">Salvar conexão</button>
    <div class="msg" id="connectionMessage"></div>
  </details>
</main>
<button class="fab" id="newBtn" aria-label="Novo lançamento">+</button>

<div class="overlay" id="overlay" hidden>
  <form class="sheet" id="entryForm" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <button type="button" class="link" id="cancelBtn">Cancelar</button>
      <h2 id="sheetTitle">Novo lançamento</h2>
      <button type="submit" class="link strong" id="saveBtn">Salvar</button>
    </div>
    <div class="seg" id="typeSeg">
      <button type="button" data-type="Gasto" class="on">Despesa</button>
      <button type="button" data-type="Entrada">Entrada</button>
      <button type="button" data-type="Dívida">Dívida</button>
    </div>
    <div class="amount-wrap"><span>R$</span><input id="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0,00" required aria-label="Valor"></div>
    <div class="group">
      <label class="cell"><span>Descrição</span><input id="description" placeholder="Ex.: Salário, aluguel" maxlength="90" required></label>
      <label class="cell"><span>Mês</span><input id="fMonth" type="month" required></label>
      <div class="cell" id="natureCell"><span>Tipo</span>
        <div class="seg" id="natureSeg"><button type="button" data-nature="Fixa" class="on">Fixa</button><button type="button" data-nature="Variável">Variável</button></div>
      </div>
    </div>
    <button type="button" class="danger" id="deleteBtn" hidden>Excluir lançamento</button>
  </form>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const STORAGE_KEY='gastos2026_appweb_url_v1';
let entries=[],editingId=null,filter='all',type='Gasto',nature='Fixa';
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const now=new Date();
const monthNow=`${now.getFullYear()}-${pad(now.getMonth()+1)}`;
let month=monthNow;
let stored='';try{stored=localStorage.getItem(STORAGE_KEY)||''}catch(e){}
$('apiUrl').value=stored;

const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=a=>a.reduce((s,x)=>s+Number(x.valor||0),0);
function monthLabel(m){const [y,mo]=m.split('-').map(Number);const s=new Date(y,mo-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});return s.charAt(0).toUpperCase()+s.slice(1)}
function shiftMonth(d){const [y,mo]=month.split('-').map(Number);const dt=new Date(y,mo-1+d,1);month=`${dt.getFullYear()}-${pad(dt.getMonth()+1)}`;render()}
function setStatus(t,ok){$('statusText').textContent=t;$('status').className='status'+(ok?'':' off')}
function message(id,t,err=false){$(id).textContent=t;$(id).className='msg'+(err?' error':'')}
let tt;
function toast(t,err=false){const el=$('toast');el.textContent=t;el.className='toast show'+(err?' err':'');clearTimeout(tt);tt=setTimeout(()=>{el.className='toast'},err?6000:2200)}
function api(){return ($('apiUrl').value||stored||'').trim()}

function extractEntries(data){
  if(Array.isArray(data))return data;
  const candidates=[data?.entries,data?.data,data?.lancamentos,data?.movimentacoes,data?.state?.entries,data?.result?.entries];
  return candidates.find(Array.isArray)||null;
}

const MESES=['janeiro','fevereiro','marco','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function normMonth(v){
  const s=String(v??'').trim();
  if(/^\d{4}-\d{2}$/.test(s))return s;
  if(/^\d{4}-\d{2}-\d{2}T/.test(s)){const d=new Date(s);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`}
  let m=s.match(/^(\d{4})-(\d{2})-\d{2}$/);if(m)return m[1]+'-'+m[2];
  m=s.match(/^(\d{1,2})\/(\d{4})$/);if(m)return m[2]+'-'+m[1].padStart(2,'0');
  m=s.match(/^\d{1,2}\/(\d{1,2})\/(\d{4})$/);if(m)return m[2]+'-'+m[1].padStart(2,'0');
  const t=s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const i=MESES.findIndex(n=>t.startsWith(n)||t.startsWith(n.slice(0,3)));
  if(i>=0){const y=(t.match(/\d{4}/)||['2026'])[0];return y+'-'+pad(i+1)}
  return s;
}

function normalizeEntry(x){
  const paid=x.pago??x.Pago??x.paid??false;
  return {
    ...x,
    id:String(x.id??x.ID??x.Id??''),
    mes:normMonth(x.mes??x.Mes??x.month??''),
    pessoa:String(x.pessoa??x.Pessoa??x.person??''),
    tipo:String(x.tipo??x.Tipo??x.type??'Gasto'),
    categoria:String(x.categoria??x.Categoria??x.category??''),
    valor:Number(x.valor??x.Valor??x.value??0),
    pago:paid===true||paid===1||paid==='1'||String(paid).toLowerCase()==='true'||String(paid).toLowerCase()==='sim'
  };
}

async function load(){
  const url=api();
  if(!url){setStatus('Configure a conexão',false);render();return false}
  try{
    setStatus('Atualizando…',true);
    const r=await fetch(url+(url.includes('?')?'&':'?')+'action=state&_='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw Error('A planilha respondeu com erro HTTP '+r.status);
    const d=await r.json();
    if(d?.ok===false||d?.success===false)throw Error(d.error||d.message||'Não foi possível carregar os lançamentos');
    const rows=extractEntries(d);
    if(!rows)throw Error('A resposta do Apps Script não trouxe a lista de lançamentos.');
    entries=rows.map(normalizeEntry);
    setStatus('Planilha conectada',true);
    render();
    return true;
  }catch(e){
    setStatus('Falha na conexão',false);
    message('connectionMessage',e.message,true);
    toast(e.message,true);
    return false;
  }
}

async function post(payload){
  const url=api();
  if(!url){toast('Configure a conexão com a planilha primeiro.',true);return null}
  try{
    setStatus('Salvando…',true);
    const body=payload.item?{...payload,...payload.item}:payload;
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
    if(!r.ok)throw Error('A planilha respondeu com erro HTTP '+r.status);
    const d=await r.json();
    if(d?.ok===false||d?.success===false)throw Error(d.error||d.message||'Falha ao salvar');
    const refreshed=await load();
    if(!refreshed)throw Error('Salvou, mas não consegui atualizar a lista. Toque em ↻ para tentar de novo.');
    return d;
  }catch(e){
    setStatus('Erro ao sincronizar',false);
    toast(e.message,true);
    return null;
  }
}

function decodeCategory(raw){
  const m=String(raw||'').match(/^\[(Fixa|Variável)\]\s*/);
  return {nature:m?m[1]:'',description:m?String(raw).replace(m[0],''):String(raw||'')};
}
function encodeCategory(desc,nat,tp){return tp==='Entrada'?desc:`[${nat}] ${desc}`}

function visible(list){
  return list.filter(x=>{
    if(filter==='pending')return !x.pago;
    if(filter==='paid')return !!x.pago;
    if(filter==='income')return x.tipo==='Entrada';
    return true;
  });
}

function render(){
  $('monthLabel').textContent=monthLabel(month);
  const me=entries.filter(x=>x.mes===month);
  const inc=sum(me.filter(x=>x.tipo==='Entrada'));
  const outs=me.filter(x=>x.tipo!=='Entrada');
  const exp=sum(outs);
  const due=sum(outs.filter(x=>!x.pago));
  $('balance').textContent=money(inc-exp);
  $('balance').className=(inc-exp)<0?'neg':'';
  $('incomeTotal').textContent=money(inc);
  $('expenseTotal').textContent=money(exp);
  $('dueTotal').textContent=money(due);
  const list=visible(me);
  if(!list.length){
    const extra=entries.length?`<small>${entries.length} na planilha · meses recebidos: ${safe([...new Set(entries.map(x=>x.mes))].join(', '))}</small>`:'';
    $('list').innerHTML=`<li class="empty">${api()?'Nenhum lançamento aqui.<br>Toque em + para adicionar.':'Abra “Conexão com a planilha” abaixo e cole a URL do seu Apps Script.'}${extra}</li>`;
    return;
  }
  $('list').innerHTML=list.slice().reverse().map(x=>{
    const c=decodeCategory(x.categoria);
    const inEntry=x.tipo==='Entrada';
    const kind=inEntry?'Entrada':(x.tipo==='Dívida'?'Dívida':c.nature||'Despesa');
    const sub=kind+(x.pago?' · '+(inEntry?'recebida':'paga'):'');
    return `<li class="row${x.pago?' done':''}" data-id="${safe(x.id)}">
      <button type="button" class="check${x.pago?' on':''}" aria-label="${x.pago?'Marcar como pendente':(inEntry?'Marcar como recebida':'Marcar como paga')}"></button>
      <div class="main"><div class="t">${safe(c.description||'Sem descrição')}</div><div class="s">${safe(sub)}</div></div>
      <div class="amt ${inEntry?'pos':''}">${inEntry?'+ ':''}${money(x.valor)}</div>
    </li>`;
  }).join('');
}

function setType(t){type=t;[...$('typeSeg').children].forEach(b=>b.classList.toggle('on',b.dataset.type===t));$('natureCell').hidden=t==='Entrada'}
function setNature(n){nature=n;[...$('natureSeg').children].forEach(b=>b.classList.toggle('on',b.dataset.nature===n))}
function openSheet(item){
  editingId=item?item.id:null;
  const c=item?decodeCategory(item.categoria):null;
  $('sheetTitle').textContent=item?'Editar lançamento':'Novo lançamento';
  $('description').value=c?c.description:'';
  $('amount').value=item?item.valor:'';
  $('fMonth').value=item?(item.mes||month):month;
  setType(item?(item.tipo||'Gasto'):'Gasto');
  setNature(c&&c.nature?c.nature:'Fixa');
  $('deleteBtn').hidden=!item;
  $('overlay').hidden=false;
  requestAnimationFrame(()=>$('overlay').classList.add('open'));
  if(!item)setTimeout(()=>$('amount').focus(),320);
}
function closeSheet(){
  $('overlay').classList.remove('open');
  setTimeout(()=>{$('overlay').hidden=true},280);
}

$('typeSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setType(b.dataset.type)});
$('natureSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setNature(b.dataset.nature)});
$('newBtn').addEventListener('click',()=>openSheet(null));
$('cancelBtn').addEventListener('click',closeSheet);
$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('overlay').hidden)closeSheet()});

$('entryForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const old=editingId?entries.find(x=>x.id===editingId):null;
  const item={
    id:editingId||undefined,
    mes:$('fMonth').value,
    pessoa:old?old.pessoa:'',
    tipo:type,
    categoria:encodeCategory($('description').value.trim(),nature,type),
    valor:Number($('amount').value),
    pago:old?!!old.pago:false
  };
  $('saveBtn').disabled=true;
  const result=await post({action:'save',item});
  $('saveBtn').disabled=false;
  if(result){
    month=item.mes;
    closeSheet();
    render();
    toast('Salvo');
  }
});

$('deleteBtn').addEventListener('click',async()=>{
  if(!editingId||!confirm('Excluir este lançamento? Isso também vale para a planilha.'))return;
  const result=await post({action:'delete',id:editingId});
  if(result){closeSheet();toast('Excluído')}
});

$('list').addEventListener('click',async e=>{
  const row=e.target.closest('.row');
  if(!row)return;
  const item=entries.find(x=>String(x.id)===row.dataset.id);
  if(!item)return;
  if(e.target.closest('.check')){
    item.pago=!item.pago;
    render();
    const result=await post({action:'togglePaid',id:item.id,pago:item.pago});
    if(!result){item.pago=!item.pago;render()}
  }else openSheet(item);
});

$('filters').addEventListener('click',e=>{
  const b=e.target.closest('[data-filter]');
  if(!b)return;
  filter=b.dataset.filter;
  [...$('filters').children].forEach(x=>x.classList.toggle('on',x===b));
  render();
});
$('prev').addEventListener('click',()=>shiftMonth(-1));
$('next').addEventListener('click',()=>shiftMonth(1));
$('refreshBtn').addEventListener('click',load);
$('connectBtn').addEventListener('click',()=>{
  const url=$('apiUrl').value.trim();
  if(!url){message('connectionMessage','Cole a URL do Web App.',true);return}
  stored=url;try{localStorage.setItem(STORAGE_KEY,url)}catch(e){}
  message('connectionMessage','Conexão salva neste navegador.');
  load();
});

if(api())load();
else{setStatus('Configure a conexão',false);render()}
</script>
</body>
</html>
