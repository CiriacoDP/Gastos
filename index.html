
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090e14">
<meta name="app-version" content="2.15.6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu dinheiro">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./assets/app-icon.png">
<link rel="icon" type="image/png" sizes="180x180" href="./assets/app-icon.png">
<title>Meu dinheiro</title>
<link rel="stylesheet" href="./appearance.css?v=2.9.35">
<link rel="stylesheet" href="./manual-light-theme.css?v=2.9.27" id="manualLightTheme" disabled>
<link rel="stylesheet" href="./navigation.css?v=2.9.27">
<link rel="stylesheet" href="./mobile-navigation.css?v=2.9.30">

</head>
<body>

<header class="shell" id="appHeader"></header>

<main class="shell">
 <div class="banner" id="banner" hidden></div>

 <section class="view active" id="overview"></section>

 <section class="view" id="income"></section>

 <section class="view" id="transactions"></section>

 <div id="settingsProfile"></div>
</main>

<div class="update-installing-overlay" id="updateInstallingOverlay" hidden>
 <div class="update-installing-card">
  <span class="update-wallet-animation" aria-hidden="true">
   <svg viewBox="0 0 112 76" role="presentation">
    <defs><linearGradient id="walletBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#347db9"/><stop offset="1" stop-color="#1c4268"/></linearGradient></defs>
    <path class="wallet-shadow" d="M16 27h76a8 8 0 0 1 8 8v25a8 8 0 0 1-8 8H20a8 8 0 0 1-8-8V35a8 8 0 0 1 4-8Z"/>
    <path class="wallet-body" d="M15 27.5h76a8 8 0 0 1 8 8v24a8 8 0 0 1-8 8H20a8 8 0 0 1-8-8v-24a8 8 0 0 1 3-8Z"/>
    <path class="wallet-flap" d="M14 31V21a7 7 0 0 1 7-7h59a7 7 0 0 1 7 7v6"/>
    <path class="wallet-pocket" d="M73 38h27v19H73a7 7 0 0 1-7-7v-5a7 7 0 0 1 7-7Z"/>
    <circle class="wallet-button" cx="80" cy="47.5" r="3"/>
    <g class="wallet-bill">
     <rect x="30" y="5" width="43" height="25" rx="4"/>
     <path d="M36 10h31M36 25h31"/>
     <circle cx="51.5" cy="17.5" r="6"/>
     <path d="M50 14.5c3-1 5 1 3 3-1 1-4 1-4 3 0 2 3 3 5 1"/>
    </g>
    <g class="wallet-coin"><circle cx="89" cy="13" r="8"/><path d="M87 10.5c3-1 5 1 3 3-1 1-4 1-4 3 0 2 3 2 5 1"/></g>
   </svg>
  </span>
  <strong id="updateInstallingTitle">Baixando atualização</strong>
  <p id="updateInstallingText">Preparando os arquivos da nova versão…</p>
  <div class="update-progress" role="progressbar" aria-label="Progresso da atualização" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
   <span class="update-progress-fill" id="updateProgressFill"></span>
  </div>
  <div class="update-progress-meta"><span id="updateProgressLabel">Aguarde um instante</span><strong id="updateProgressPercent">0%</strong></div>
 </div>
</div>

<div class="update-overlay" id="updateOverlay" hidden>
 <section class="update-card" role="dialog" aria-modal="true" aria-labelledby="updateTitle" aria-describedby="updateDescription">
  <div class="update-card-top">
   <span class="update-status-pill"><i></i> Nova versão disponível</span>
   <span class="update-version-mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 17v3h14v-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
   </span>
  </div>
  <div class="update-card-copy">
   <h2 id="updateTitle">Tem novidade no Meu dinheiro!</h2>
   <p id="updateDescription">Uma nova versão está pronta para instalação.</p>
  </div>
  <div class="update-version-comparison">
   <div><small>Versão atual</small><strong id="updateCurrentVersion">v2.9.31</strong></div>
   <span aria-hidden="true">→</span>
   <div><small>Nova versão</small><strong id="updateNewVersion">v2.9.31</strong></div>
  </div>
  <div class="update-release-notes" id="updateReleaseNotes" aria-label="Novidades desta versão"></div>
  <button class="primary update-now-button" id="updateNowBtn" type="button">Atualizar agora</button>
  <button class="update-later-button" id="updateLaterBtn" type="button">Depois</button>
  <small class="update-data-note">Seus lançamentos e configurações serão preservados.</small>
 </section>
</div>

<div class="toast" id="toast" role="status"></div>

<div class="app-dialog-overlay" id="appDialogOverlay" hidden>
 <section class="app-dialog" role="dialog" aria-modal="true" aria-labelledby="appDialogTitle" aria-describedby="appDialogMessage">
  <h2 id="appDialogTitle">Aviso</h2>
  <p id="appDialogMessage"></p>
  <div class="app-dialog-actions" id="appDialogActions"></div>
 </section>
</div>


<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script>
(async function loadOverviewProfile(){
 const mobile=window.matchMedia('(max-width:979px), (hover:none) and (pointer:coarse)').matches;
 const profile=mobile?'mobile':'desktop';
 const overview=document.getElementById('overview');
 const headerTarget=document.getElementById('appHeader');
 const income=document.getElementById('income');
 const transactions=document.getElementById('transactions');
 try{
  const versionResponse=await fetch('./version.json?profile='+Date.now(),{cache:'no-store'});
  if(!versionResponse.ok)throw new Error('Não foi possível consultar as versões do aplicativo.');
  const release=await versionResponse.json();
  const indexVersion=document.querySelector('meta[name="app-version"]')?.content||'0.0.0';
  if(release.ready!==true||release.version!==indexVersion)throw new Error('As versões compartilhadas ainda estão sendo publicadas.');
  const sharedVersion=release.version;
  const profileVersion=release[profile]||sharedVersion;
  window.__overviewProfile=profile;
  window.__overviewVersion=profileVersion;
  const response=await fetch('./overview-'+profile+'.html?v='+encodeURIComponent(profileVersion),{cache:'no-store'});
  if(!response.ok)throw new Error('Não foi possível carregar as telas do perfil.');
  const profileHtml=await response.text();
  const overviewVersion=profileHtml.match(/<!--\s*overview-version:\s*([0-9.]+)\s*-->/i)?.[1]||'';
  if(overviewVersion!==profileVersion)throw new Error('A versão do HTML do perfil ainda está sendo publicada.');
  const profileTemplate=document.createElement('template');
  profileTemplate.innerHTML=profileHtml;
  const navigationFragment=profileTemplate.content.querySelector('[data-navigation-profile]');
  const headerFragment=profileTemplate.content.querySelector('[data-header-profile]');
  const overviewFragment=profileTemplate.content.querySelector('[data-overview]');
  const incomeFragment=profileTemplate.content.querySelector('[data-income-profile]');
  const settingsFragment=profileTemplate.content.querySelector('[data-settings-profile]');
  const transactionsFragment=profileTemplate.content.querySelector('[data-transactions-profile]');
  const entryFragment=profileTemplate.content.querySelector('[data-entry-profile]');
  const paymentScannerFragment=profileTemplate.content.querySelector('[data-payment-scanner-profile]');
  const settingsTarget=document.getElementById('settingsProfile');
  if(!navigationFragment||!headerFragment||!headerTarget||!overviewFragment||!incomeFragment||!settingsFragment||!transactionsFragment||!entryFragment||(profile==='mobile'&&!paymentScannerFragment)||(profile==='desktop'&&paymentScannerFragment)||!settingsTarget||!transactions)throw new Error('A estrutura das telas do perfil está incompleta.');
  document.body.insertAdjacentHTML('afterbegin',navigationFragment.innerHTML);
  headerTarget.innerHTML=headerFragment.innerHTML;
  overview.innerHTML=overviewFragment.outerHTML;
  income.innerHTML=incomeFragment.innerHTML;
  const profileTransactions=transactionsFragment.querySelector('#transactions');
  if(!profileTransactions)throw new Error('A tela de Despesas do perfil está incompleta.');
  transactions.innerHTML=profileTransactions.innerHTML;
  settingsTarget.replaceWith(...settingsFragment.childNodes);
  document.body.insertAdjacentHTML('beforeend',entryFragment.innerHTML);
  if(paymentScannerFragment)document.body.insertAdjacentHTML('beforeend',paymentScannerFragment.innerHTML);
  const stylesheet=document.createElement('link');
  stylesheet.rel='stylesheet';
  stylesheet.href='./overview-'+profile+'.css?v='+encodeURIComponent(profileVersion);
  await new Promise((resolve,reject)=>{
   stylesheet.onload=resolve;
   stylesheet.onerror=()=>reject(new Error('Não foi possível carregar o estilo do perfil.'));
   document.head.appendChild(stylesheet);
  });
  const navigationScript=document.createElement('script');
  navigationScript.src=profile==='mobile'?'./mobile-navigation.js?v='+encodeURIComponent(sharedVersion):'./navigation.js?v='+encodeURIComponent(sharedVersion);
  await new Promise((resolve,reject)=>{
   navigationScript.onload=resolve;
   navigationScript.onerror=()=>reject(new Error('Não foi possível iniciar a navegação do perfil.'));
   document.body.appendChild(navigationScript);
  });
  const profileQuery=window.matchMedia('(max-width:979px), (hover:none) and (pointer:coarse)');
  const reloadOnProfileChange=()=>{if(profileQuery.matches!==(profile==='mobile'))window.location.reload();};
  if(profileQuery.addEventListener)profileQuery.addEventListener('change',reloadOnProfileChange);
  else if(profileQuery.addListener)profileQuery.addListener(reloadOnProfileChange);
  const app=document.createElement('script');
  app.src='./app.js?v='+encodeURIComponent(sharedVersion);
  app.onerror=()=>{
   overview.textContent='Não foi possível iniciar o aplicativo. Atualize a página.';
   income.textContent='Não foi possível iniciar o aplicativo. Atualize a página.';
   transactions.textContent='Não foi possível iniciar o aplicativo. Atualize a página.';
  };
  document.body.appendChild(app);
 }catch(error){
  console.error(error);
  overview.textContent='Não foi possível carregar o aplicativo. Verifique sua conexão e atualize a página.';
  income.textContent='Não foi possível carregar o aplicativo. Verifique sua conexão e atualize a página.';
  transactions.textContent='Não foi possível carregar o aplicativo. Verifique sua conexão e atualize a página.';
 }
})();
</script>
</body>
</html>
